<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>
      <a-assets timeout="20000">
        <img id="sunset" src="images/sunset.svg">
        <a-asset-item id="truck" src="images/models/CesiumMilkTruck.glb"></a-asset-item>
        <a-asset-item id="duck" src="images/models/Duck.glb"></a-asset-item>
      </a-assets>

      <!-- Sky and desert floor -->
      <a-sky src="#sunset"></a-sky>

      <a-plane position="0 0 -12" rotation="-90 0 0"
        width="180" height="180" color="#BA7953">
      </a-plane>

      <!-- The road stops at the flooded section -->
      <a-box position="0 0.03 5" width="5.5" height="0.06"
        depth="30" color="#49414A">
      </a-box>

      <!-- Yellow lines down the middle of the road -->
      <a-box position="0 0.07 8" width="0.13" height="0.02"
        depth="2" color="#FFCA62"></a-box>
      <a-box position="0 0.07 3" width="0.13" height="0.02"
        depth="2" color="#FFCA62"></a-box>
      <a-box position="0 0.07 -2" width="0.13" height="0.02"
        depth="2" color="#FFCA62"></a-box>
      <a-box position="0 0.07 -7" width="0.13" height="0.02"
        depth="2" color="#FFCA62"></a-box>

      <!-- The flood. A flattened circle gives it a curved shoreline. -->
      <a-circle position="0 0.09 -21" rotation="-90 0 0"
        radius="12" scale="1.6 1 1" color="#559EAA"
        material="roughness: 0.35">
      </a-circle>

      <!-- The milk truck pulled onto the shoulder -->
      <a-entity gltf-model="#truck" position="-3.9 0.08 -3"
        rotation="0 65 0" scale="0.85 0.85 0.85">
      </a-entity>

      <!-- The giant duck slowly bobs in the water -->
      <a-entity gltf-model="#duck" position="0 0.06 -16"
        rotation="0 -35 0" scale="4 4 4"
        animation="property: position; from: 0 0.06 -16; to: 0 0.32 -16;
                  dur: 2400; dir: alternate; loop: true; easing: easeInOutSine">
      </a-entity>

      <!-- Roadside warning sign -->
      <a-entity position="3.4 0 -5" rotation="0 -12 0">
        <a-box position="0 1 0" width="0.14" height="2"
          depth="0.14" color="#75665D"></a-box>

        <a-box position="0 2.1 0" rotation="0 0 45"
          width="1.35" height="1.35" depth="0.09"
          color="#F1AD36"></a-box>

        <a-text value="DUCK\nCROSSING" position="0 2.1 0.06"
          align="center" color="#29232C" width="2.7"></a-text>
      </a-entity>

      <!-- A few flat-topped mesas around the edge of the water -->
      <a-cylinder position="-23 2 -26" height="4"
        radius="6" segments-radial="7" color="#A55749">
      </a-cylinder>

      <a-cylinder position="-23 4.65 -26" height="1.3"
        radius="4.5" segments-radial="7" color="#C47755">
      </a-cylinder>

      <a-cylinder position="22 2.5 -32" height="5"
        radius="7" segments-radial="6" color="#985958">
      </a-cylinder>

      <a-cylinder position="16 1.2 -34" height="2.4"
        radius="4" segments-radial="6" color="#B36C56">
      </a-cylinder>

      <!-- Lighting and starting view -->
      <a-light type="ambient" color="#FFF1E6" intensity="1.35"></a-light>
      <a-light type="directional" position="-6 9 -4"
        color="#FFD09A" intensity="2"></a-light>

      <a-camera position="0 1.6 6"></a-camera>
    </a-scene>
  </body>
</html>
